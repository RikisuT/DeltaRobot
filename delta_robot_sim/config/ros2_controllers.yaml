controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    # Keep these limits aligned with real motor capabilities.
    # ST3215 (jbf1-3): target envelope ~11.1 rad/s.
    # STS3032 (Bevelj1-2): set from vendor/measured data; currently conservative 10 rad/s.
    joints:
      - jbf1
      - jbf2
      - jbf3
      - Bevelj1
      - Bevelj2
      - Tj1
      - BeveljEE

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    constraints:
      goal_time: 0.2
      stopped_velocity_tolerance: 0.05
      jbf1:
        max_velocity: 11.1
      jbf2:
        max_velocity: 11.1
      jbf3:
        max_velocity: 11.1
      Bevelj1:
        max_velocity: 10.0
      Bevelj2:
        max_velocity: 10.0
      Tj1:
        max_velocity: 10.0
      BeveljEE:
        max_velocity: 10.0

    gains:
      jbf1: {p: 100.0, i: 1.0, d: 10.0}
      jbf2: {p: 100.0, i: 1.0, d: 10.0}
      jbf3: {p: 100.0, i: 1.0, d: 10.0}
      Bevelj1: {p: 100.0, i: 1.0, d: 10.0}
      Bevelj2: {p: 100.0, i: 1.0, d: 10.0}
      Tj1: {p: 100.0, i: 1.0, d: 10.0}
      BeveljEE: {p: 100.0, i: 1.0, d: 10.0}
